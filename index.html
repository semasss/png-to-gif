<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PNG to GIF Converter</title>
  <style>
    :root {
      --primary-color: #2196f3;
      --primary-dark: #1976d2;
      --primary-light: #bbdefb;
      --background-color: #f5f5f5;
      --surface-color: #ffffff;
      --text-color: #333333;
      --text-secondary: #666666;
      --error-color: #f44336;
      --success-color: #4caf50;
      --border-radius: 12px;
      --shadow-color: rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background-color: #1a1a1a;
        --surface-color: #2d2d2d;
        --text-color: #ffffff;
        --text-secondary: #b0b0b0;
        --shadow-color: rgba(0, 0, 0, 0.3);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    body {
      background-color: var(--background-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: var(--surface-color);
      padding: 30px;
      border-radius: var(--border-radius);
      box-shadow: 0 8px 32px var(--shadow-color);
      width: 100%;
      max-width: 800px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      color: var(--primary-color);
      margin-bottom: 20px;
      font-size: 2em;
      text-align: center;
    }

    .button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 1em;
      transition: all 0.3s ease;
      width: 100%;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px var(--shadow-color);
    }

    .button:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px var(--shadow-color);
    }

    .button:disabled {
      background-color: var(--text-secondary);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      color: var(--text-secondary);
      font-size: 0.9em;
    }

    input[type="number"] {
      padding: 10px;
      border: 2px solid var(--primary-light);
      border-radius: var(--border-radius);
      font-size: 1em;
      background-color: var(--surface-color);
      color: var(--text-color);
      transition: all 0.3s ease;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    select {
      padding: 10px;
      border: 2px solid var(--primary-light);
      border-radius: var(--border-radius);
      font-size: 1em;
      background-color: var(--surface-color);
      color: var(--text-color);
      transition: all 0.3s ease;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232196f3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
      padding-right: 40px;
    }

    select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    select option {
      background-color: var(--surface-color);
      color: var(--text-color);
    }

    #directory-display {
      margin: 20px 0;
      padding: 15px;
      background-color: var(--primary-light);
      border-radius: var(--border-radius);
      color: var(--primary-dark);
      font-size: 0.9em;
      word-break: break-all;
    }

    #files-container {
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
      border: 2px solid var(--primary-light);
      border-radius: var(--border-radius);
      padding: 15px;
    }

    #file-list {
      list-style: none;
    }

    #file-list li {
      padding: 8px;
      border-bottom: 1px solid var(--primary-light);
      color: var(--text-secondary);
    }

    #file-list li:last-child {
      border-bottom: none;
    }

    #progress-container {
      display: none;
      margin-top: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background-color: var(--primary-light);
      border-radius: 10px;
      overflow: hidden;
    }

    #progress {
      width: 0%;
      height: 100%;
      background-color: var(--primary-color);
      transition: width 0.3s ease;
    }

    #progress-text {
      margin-top: 10px;
      text-align: center;
      color: var(--text-secondary);
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: var(--border-radius);
      text-align: center;
      display: none;
    }

    #status.success {
      background-color: var(--success-color);
      color: white;
      display: block;
    }

    #status.error {
      background-color: var(--error-color);
      color: white;
      display: block;
    }

    /* Стили для скроллбара */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--primary-light);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PNG to GIF Converter</h1>
    
    <button id="choose-directory" class="button">Выбрать директорию</button>
    <div id="directory-display">Директория не выбрана</div>
    
    <div class="settings-grid">
      <div class="setting-group">
        <label for="max-kb">Максимальный размер GIF (МБ):</label>
        <input type="number" id="max-kb" value="10" min="1">
      </div>
      <div class="setting-group">
        <label for="frame-delay">Задержка между кадрами (сек):</label>
        <input type="number" id="frame-delay" value="0.1" min="0.1" step="0.1">
      </div>
      <div class="setting-group">
        <label for="color-count">Количество цветов:</label>
        <select id="color-count">
          <option value="256">256 цветов</option>
          <option value="512">512 цветов</option>
          <option value="1024">1024 цвета</option>
          <option value="2048">2048 цветов</option>
          <option value="4096">4096 цветов</option>
        </select>
      </div>
    </div>
    
    <button id="convert-button" class="button" disabled>Конвертировать в GIF</button>
    
    <div id="files-container" style="display: none;">
      <h3>Найденные PNG файлы:</h3>
      <ul id="file-list"></ul>
    </div>
    
    <div id="progress-container">
      <div class="progress-bar">
        <div id="progress"></div>
      </div>
      <div id="progress-text">0%</div>
    </div>
    
    <div id="status"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
