<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <title>ЖИФ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="status"></div>
    <div id="main-page" class="page active">
      <!-- Карточка Данные -->
      <section class="card data-card">
        <h2 class="card-title">Данные</h2>
        <p class="subtitle" id="choose-sub">Выбери папку в которой есть изображения</p>
        <button id="choose-directory" class="choose-btn">Выбор папки <span class="arrow">›</span></button>
        <p id="directory-display" class="path-display" style="display:none;"></p>
        <p id="groups-info" class="groups-info" style="display:none;">В папке нашлось <span id="groups-count"></span> групп <button id="groups-help" class="help-pill">что это?</button></p>
        <div id="file-list" class="groups-list"></div>
      </section>

      <!-- Карточка Настройки -->
      <section class="card settings-card">
        <div class="card-header">
          <h2 class="card-title">Настройки</h2>
          <button id="reset-settings" class="help-pill reset-btn">сбросить</button>
        </div>
        <div class="settings-grid new-grid">
          <div class="setting-col">
            <label for="frame-delay">Длина кадра</label>
            <input type="number" id="frame-delay" value="3" min="0.01" step="0.1" placeholder="3 сек">
          </div>
          <div class="setting-col">
            <label for="color-count">Количество цветов</label>
            <select id="color-count">
              <option value="256">256</option>
              <option value="128">128</option>
            </select>
          </div>
        </div>
        <button id="convert-button" class="convert-btn" disabled>Жмахнуть ЖИФ <span class="arrow">›</span></button>
        <div id="progress-container" style="display: none; margin-top: 24px;">
          <div class="progress-bar-background">
            <div id="progress" class="progress-bar-foreground"></div>
          </div>
          <p id="progress-text" style="text-align: center; margin-top: 8px; font-size: 14px; color: #6e6e73;"></p>
          <p id="detail-status" style="text-align: center; margin-top: 4px; font-size: 12px; color: #8a8a8e;"></p>
        </div>
      </section>
    </div>

    <!-- Страница результатов -->
    <div id="results-page" class="page">
      <div class="results-header">
        <h2>Результаты</h2>
        <div class="results-actions">
          <button id="back-to-main" class="button secondary">Назад</button>
          <button id="open-output-folder-button" class="button">Открыть папку</button>
        </div>
      </div>
      <div id="results-grid" class="result-grid"></div>
    </div>

    <!-- Модалки -->
    <div id="info-modal" class="modal">
      <div class="modal-content">
        <span class="modal-close">×</span>
        <h3>Как это работает?</h3>
        <p>Программа ищет PNG-файлы в выбранной папке, группирует их и превращает каждую группу в отдельный GIF при помощи <a href="https://gif.ski/" target="_blank">gifski</a>.</p>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
