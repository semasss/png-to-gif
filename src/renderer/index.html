<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';"><title>ЖИФ</title><script>// Polyfill for global variable in Electron
    window.global = window.globalThis;</script><style>/* Preloader styles */
    .preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .preloader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e1e1e1;
      border-top: 3px solid #007aff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      .preloader {
        background: #1a1a1a;
      }
      .spinner {
        border-color: rgba(255, 255, 255, 0.1);
        border-top-color: #0a84ff;
      }
    }</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><script defer="defer" src="./bundle.vendors.390944cc9c88f49e0b13.js"></script><script defer="defer" src="./bundle.main.9c4c4db00512bce96934.js"></script></head><body><div class="preloader" id="preloader"><div class="spinner"></div></div><div id="root"></div><script>// Hide preloader when React is ready
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const preloader = document.getElementById('preloader');
        if (preloader) {
          preloader.classList.add('hidden');
          setTimeout(() => {
            preloader.remove();
          }, 300);
        }
      }, 500);
    });</script></body></html>
