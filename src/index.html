<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <title>ЖИФ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Главная страница -->
    <div id="main-page" class="page active">
      <div class="main-content">
        <div class="app-title">
          <img src="assets/icon.png" alt="App Icon" class="app-icon">
          <h1>ЖИФ</h1>
        </div>
        <div class="form-container">
          <form id="conversion-form">
            <button type="button" id="choose-directory" class="button">Выбрать директорию</button>
            <div id="directory-display">Директория не выбрана</div>
            
            <div class="settings-grid">
              <div class="setting-group">
                <label for="max-kb">Максимальный размер GIF (МБ):</label>
                <input type="number" id="max-kb" value="10" min="1">
              </div>
              <div class="setting-group">
                <label for="frame-delay">Задержка между кадрами (сек):</label>
                <input type="number" id="frame-delay" value="0.1" min="0.1" step="0.1">
              </div>
              <div class="setting-group">
                <label for="color-count">Количество цветов:</label>
                <select id="color-count">
                  <option value="32">32</option>
                  <option value="64">64</option>
                  <option value="128">128</option>
                  <option value="256" selected>256</option>
                </select>
              </div>
              <div class="setting-group">
                <label for="dither-select">Дизеринг:</label>
                <select id="dither-select">
                  <option value="none">None</option>
                  <option value="FloydSteinberg">Floyd-Steinberg</option>
                  <option value="Riemersma">Riemersma</option>
                </select>
                <div id="dither-explanation"></div>
              </div>
            </div>
            
            <div class="button-group">
              <button type="button" id="reset-settings" class="button secondary">Сбросить настройки</button>
              <button type="button" id="convert-button" class="button" disabled>Конвертировать в GIF</button>
            </div>
            
            <div id="files-container" style="display: none;">
              <h3>Найденные PNG файлы:</h3>
              <ul id="file-list"></ul>
            </div>
            
            <div id="progress-container">
              <div class="progress-bar">
                <div id="progress"></div>
              </div>
              <div id="progress-text">0%</div>
            </div>
            
            <div id="status"></div>
          </form>
        </div>
      </div>
    </div>

    <!-- Страница результатов -->
    <div id="results-page" class="page">
      <h1>Результаты конвертации</h1>
      <div id="results-grid" class="result-grid"></div>
      <div class="button-group-results">
        <button id="open-folder-button" class="button">Открыть папку</button>
        <button id="back-button" class="button secondary">← Назад</button>
      </div>
    </div>

    <div class="info-button" id="info-button">i</div>
  </div>

  <!-- Модальное окно с информацией -->
  <div id="info-modal" class="modal">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <pre id="ascii-logo" class="ascii-logo"></pre>
      <p style="text-align: center; margin-top: 20px;">
        Разработано командой ЦЕХ МОЗГ:<br>
        Сёмой и Егором
      </p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
